<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Midnight Snackdown</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0c0a09;
      color: #fafaf9;
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      display: block;
    }
    #fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: #292524;
      border: 1px solid #57534e;
      color: #fafaf9;
      padding: 6px 14px;
      border-radius: 6px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      z-index: 100;
    }
    #fullscreen-btn:hover {
      background: #44403c;
    }
    #controls-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #1c1917;
      border: 1px solid #44403c;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 13px;
      color: #d6d3d1;
      text-align: center;
      z-index: 90;
      white-space: nowrap;
      transition: opacity 0.3s;
    }
    #controls-hint:hover {
      opacity: 1 !important;
    }
    #controls-hint strong {
      color: #fde68a;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <button id="fullscreen-btn" title="Toggle Fullscreen">Fullscreen</button>
    <canvas id="game-canvas" width="1604" height="580"></canvas>
    <div id="controls-hint">
      <strong>Move</strong> WASD / Arrows &nbsp;|&nbsp;
      <strong>Rummage / Grab</strong> Space / E &nbsp;|&nbsp;
      <strong>Swat</strong> F / Q &nbsp;|&nbsp;
      <strong>Tool</strong> 1-5 (0 none) &nbsp;|&nbsp;
      <strong>Set trap</strong> Shift + 1-5
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
